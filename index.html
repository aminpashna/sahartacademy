<style>
:root{
  --canvas:#F6F3EC;--paper:#FCFAF5;--ink:#211E1A;--ink-soft:#6B655B;
  --line:#211e1a16;--line-strong:#211e1a2b;--clay:#B05A3C;--clay-deep:#8C4429;
  --a-red:#C24E36;--a-blue:#2E3C7E;--a-ochre:#D89A4C;--a-jade:#3C7560;--a-plum:#6E3C6B;
  --maxw:1220px;--gut:clamp(22px,5vw,72px);
  --f-display:"Fraunces",Georgia,serif;--f-body:"Manrope",system-ui,sans-serif;--f-mono:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.eyebrow .i{color:var(--clay)}
.btn{display:inline-flex;align-items:center;gap:.7em;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:400;text-decoration:none;padding:1em 1.7em;border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);transition:background .35s ease,color .35s ease,border-color .35s ease}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn--solid{background:var(--clay);border-color:var(--clay);color:#fff}
.btn--solid:hover{background:var(--clay-deep);border-color:var(--clay-deep);color:#fff}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--clay);outline-offset:4px}
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--canvas) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav__row{display:flex;align-items:center;justify-content:space-between;height:74px}
.brand{display:flex;align-items:baseline;gap:.6em;text-decoration:none}
.brand b{font-family:var(--f-display);font-weight:500;font-size:1.4rem;letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
.nav__links{display:flex;align-items:center;gap:clamp(16px,2.2vw,34px)}
.nav__links a{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--ink-soft);transition:color .25s}
.nav__links a:hover{color:var(--ink)}
.nav__toggle{display:none;background:none;border:1px solid var(--ink);padding:.55em .8em;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
@media (max-width:880px){
  .nav__links{position:fixed;inset:74px 0 auto 0;flex-direction:column;align-items:flex-start;gap:4px;background:var(--paper);border-bottom:1px solid var(--line-strong);padding:20px var(--gut) 30px;transform:translateY(-130%);transition:transform .4s ease}
  .nav__links.open{transform:translateY(0)}
  .nav__links a{font-size:1.05rem;padding:.5em 0}
  .nav__toggle{display:inline-block}
}
.hero{padding:clamp(54px,9vw,120px) 0 clamp(34px,5vw,60px)}
.hero__grid{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(28px,5vw,64px);align-items:end}
.hero__title{font-family:var(--f-display);font-weight:400;font-size:clamp(3rem,10.5vw,8rem);line-height:.98;letter-spacing:-.018em;margin:.32em 0 0}
.hero__title em{font-style:italic;color:var(--clay)}
.hero__lead{margin:1.6em 0 0;max-width:32ch;font-size:clamp(1.05rem,1.8vw,1.28rem);color:var(--ink-soft);line-height:1.65}
.hero__cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:2.1em}
.hero__card{border:1px solid var(--line-strong);background:var(--paper);overflow:hidden;align-self:end;box-shadow:0 24px 48px -34px #211e1a55}
.hero__card .piece__media{aspect-ratio:4/5}
.hero__card figcaption{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;color:var(--ink-soft);border-top:1px solid var(--line)}
.hero__card figcaption b{font-family:var(--f-display);font-size:.92rem;font-weight:500;color:var(--ink);letter-spacing:0}
.rule-line{margin-top:clamp(40px,6vw,72px);border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);overflow:hidden}
.rule-line__track{display:flex;width:max-content;white-space:nowrap;animation:slide 44s linear infinite}
@media (prefers-reduced-motion:reduce){.rule-line__track{animation:none}}
.rule-line__track span{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(1.1rem,2.6vw,1.7rem);color:var(--ink-soft);padding:.7em 1.1em}
.rule-line__track .d{color:var(--clay);font-style:normal;align-self:center;font-size:.6em}
@keyframes slide{to{transform:translateX(-50%)}}
.section{padding:clamp(64px,10vw,128px) 0}
.section__head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap;margin-bottom:clamp(34px,5vw,60px)}
.section__title{font-family:var(--f-display);font-weight:400;font-size:clamp(2.1rem,5vw,3.8rem);line-height:1.02;letter-spacing:-.02em;margin:.28em 0 0}
.section__title em{font-style:italic;color:var(--clay)}
.lead-note{max-width:34ch;color:var(--ink-soft);margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;background:transparent;border:1px solid transparent;border-bottom-color:var(--line-strong);padding:.6em .9em;cursor:pointer;color:var(--ink-soft);transition:.25s}
.filters button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--clay)}
.filters button:hover{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(20px,2.6vw,38px)}
.piece{grid-column:span 4;display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.piece:nth-child(7n+1){grid-column:span 6}
.piece:nth-child(7n+4){grid-column:span 8}
.piece__media{aspect-ratio:4/5;position:relative;overflow:hidden;background:#e6e1d6;border:1px solid var(--line)}
.piece:nth-child(7n+1) .piece__media,.piece:nth-child(7n+4) .piece__media{aspect-ratio:16/11}
.piece__media svg,.piece__media img,.piece__media .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.piece:hover{transform:translateY(-5px)}
.piece:hover .piece__media svg,.piece:hover .piece__media img,.piece:hover .piece__media .ph{transform:scale(1.04)}
.piece__cap{display:flex;justify-content:space-between;gap:14px;padding:16px 2px 0}
.piece__cap h3{margin:.1em 0 0;font-family:var(--f-display);font-weight:500;font-size:1.18rem;letter-spacing:-.01em}
.piece__cap .meta{font-family:var(--f-mono);font-size:.64rem;line-height:1.6;color:var(--ink-soft);text-align:right;white-space:nowrap}
.tag{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--clay)}
@media (max-width:880px){.piece,.piece:nth-child(7n+1),.piece:nth-child(7n+4){grid-column:span 6}}
@media (max-width:560px){.piece,.piece:nth-child(7n+1),.piece:nth-child(7n+4){grid-column:span 12}}
.about{background:var(--ink);color:var(--canvas)}
.about .eyebrow{color:#ffffff80}
.about__grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(32px,6vw,80px);align-items:center}
.about__portrait{position:relative;overflow:hidden;aspect-ratio:3/4;background:#000;border:1px solid #ffffff1f}
.about__portrait svg,.about__portrait img,.about__portrait .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.about__title{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,4vw,3rem);line-height:1.12;letter-spacing:-.02em;margin:.5em 0 .7em}
.about__title em{font-style:italic;color:var(--clay)}
.about p{color:#ffffffcf;max-width:56ch;font-weight:400}
.about p + p{margin-top:1.1em}
.stats{display:flex;flex-wrap:wrap;gap:40px;margin-top:40px;border-top:1px solid #ffffff22;padding-top:32px}
.stat b{display:block;font-family:var(--f-display);font-weight:500;font-size:2.2rem;line-height:1}
.stat span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#ffffff80}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,2.6vw,30px)}
.class{border-top:1px solid var(--line-strong);padding:26px 0 0;display:flex;flex-direction:column;gap:14px}
.class__num{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;color:var(--clay)}
.class h3{font-family:var(--f-display);font-weight:500;font-size:1.5rem;letter-spacing:-.01em;margin:0;line-height:1.1}
.class p{margin:0;font-size:.96rem;color:var(--ink-soft)}
.class__meta{margin-top:8px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px}
@media (max-width:880px){.classes{grid-template-columns:1fr;gap:0}.class{padding:26px 0}}
.acquire{background:var(--paper);border-block:1px solid var(--line)}
.shop__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,3vw,40px)}
.product{display:flex;flex-direction:column;gap:14px}
.product__media{aspect-ratio:1/1;position:relative;overflow:hidden;border:1px solid var(--line)}
.product__media svg,.product__media img,.product__media .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.product:hover .product__media svg,.product:hover .product__media img,.product:hover .product__media .ph{transform:scale(1.04)}
.product__body{display:flex;flex-direction:column;gap:6px;flex:1}
.product__body h3{font-family:var(--f-display);font-weight:500;font-size:1.22rem;margin:0;letter-spacing:-.01em}
.product__body .desc{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.04em;color:var(--ink-soft);margin:0}
.product__body .price{font-family:var(--f-display);font-style:italic;font-size:1.1rem;margin:.2em 0 .6em}
.product .btn{align-self:flex-start;margin-top:auto}
@media (max-width:880px){.shop__grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.shop__grid{grid-template-columns:1fr}}
.contact{background:var(--ink);color:var(--canvas)}
.contact .eyebrow{color:#ffffff80}
.contact__grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(32px,6vw,72px);align-items:start}
.contact h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1;letter-spacing:-.025em;margin:.3em 0 .5em}
.contact h2 em{font-style:italic;color:var(--clay)}
.contact p{max-width:44ch;color:#ffffffc4}
.contact__list{list-style:none;margin:0;padding:0}
.contact__list li{border-top:1px solid #ffffff22}
.contact__list li:last-child{border-bottom:1px solid #ffffff22}
.contact__list a{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:20px 2px;text-decoration:none;transition:padding .3s ease}
.contact__list a:hover{padding-left:14px}
.contact__list a span{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#ffffff80}
.contact__list a b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.foot{background:var(--canvas);padding:50px 0;border-top:1px solid var(--line)}
.foot__row{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;color:var(--ink-soft)}
.foot a{text-decoration:none}
.foot a:hover{color:var(--clay)}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
@media (max-width:880px){.hero__grid,.about__grid,.contact__grid{grid-template-columns:1fr}.hero__card{display:none}}
</style>
</head>

<script>
(function(){
  var yr=document.getElementById('yr'); if(yr) yr.textContent=new Date().getFullYear();
  var toggle=document.querySelector('.nav__toggle'); var menu=document.getElementById('menu');
  if(toggle&&menu){toggle.addEventListener('click',function(){var o=menu.classList.toggle('open');toggle.setAttribute('aria-expanded',o);});menu.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){menu.classList.remove('open');toggle.setAttribute('aria-expanded','false');});});}

  var PH=[['#2E3C7E','#C24E36'],['#3C7560','#D89A4C'],['#6E3C6B','#C24E36'],['#D89A4C','#2E3C7E'],['#211E1A','#C24E36'],['#2E3C7E','#3C7560']];
  function ph(i){var p=PH[i%PH.length];var d=document.createElement('div');d.className='ph';d.style.background='linear-gradient(135deg,'+p[0]+','+p[1]+')';return d;}
  function media(image,i){var f=document.createDocumentFragment();if(image){var im=document.createElement('img');im.src=image;im.alt='';im.loading='lazy';f.append(im);}else{f.append(ph(i));}return f;}
  function setHeading(node,title,accent,after){if(!node)return;node.textContent='';node.append(document.createTextNode((title||'')+((accent||after)?' ':'')));if(accent){var em=document.createElement('em');em.textContent=accent;node.append(em);}if(after){node.append(document.createTextNode(' '+after));}}
  function t(id,val){var n=document.getElementById(id);if(n)n.textContent=val||'';}
  function cap(s){s=s||'';return s.charAt(0).toUpperCase()+s.slice(1);}

  function render(d){
    var h=d.hero||{};
    t('heroEyebrow',h.eyebrow); setHeading(document.getElementById('heroTitle'),h.title,h.accent);
    t('heroLead',h.lead); t('heroPrimary',h.primaryLabel); t('heroSecondary',h.secondaryLabel);
    var hc=document.getElementById('heroCardMedia'); if(hc) hc.append(media(h.cardImage,0));
    t('heroCardTitle',h.cardTitle); t('heroCardCaption',h.cardCaption);

    var w=d.works||{}; setHeading(document.getElementById('worksTitle'),w.title,w.accent);
    var gal=document.getElementById('gallery');
    (w.items||[]).forEach(function(it,i){
      var fig=document.createElement('figure'); fig.className='piece reveal'; fig.dataset.type=(it.category||'').toLowerCase();
      var m=document.createElement('div'); m.className='piece__media'; m.append(media(it.image,i));
      var c=document.createElement('figcaption'); c.className='piece__cap';
      var left=document.createElement('div');
      var tag=document.createElement('span'); tag.className='tag'; tag.textContent=cap(it.category);
      var h3=document.createElement('h3'); h3.textContent=it.title||'';
      left.append(tag,h3);
      var meta=document.createElement('div'); meta.className='meta';
      meta.append(document.createTextNode(it.year||'')); meta.append(document.createElement('br'));
      meta.append(document.createTextNode(it.medium||'')); meta.append(document.createElement('br'));
      meta.append(document.createTextNode(it.dimensions||''));
      c.append(left,meta); fig.append(m,c); gal.append(fig);
    });

    var a=d.about||{};
    t('aboutEyebrow',a.eyebrow); setHeading(document.getElementById('aboutTitle'),a.title,a.accent,a.titleAfter);
    var ab=document.getElementById('aboutBody'); (a.paragraphs||[]).forEach(function(p){var el=document.createElement('p');el.textContent=p;ab.append(el);});
    var por=document.getElementById('aboutPortrait'); if(por) por.append(media(a.portraitImage,2));
    var st=document.getElementById('aboutStats'); (a.stats||[]).forEach(function(s){var d2=document.createElement('div');d2.className='stat';var b=document.createElement('b');b.textContent=s.value||'';var sp=document.createElement('span');sp.textContent=s.label||'';d2.append(b,sp);st.append(d2);});

    var ac=d.academy||{}; setHeading(document.getElementById('academyTitle'),ac.title,ac.accent); t('academyNote',ac.note);
    var cl=document.getElementById('classes');
    (ac.classes||[]).forEach(function(c){var art=document.createElement('article');art.className='class reveal';
      var num=document.createElement('span');num.className='class__num';num.textContent=c.name||'';
      var h3=document.createElement('h3');h3.textContent=c.title||'';
      var p=document.createElement('p');p.textContent=c.description||'';
      var mt=document.createElement('div');mt.className='class__meta';
      var s1=document.createElement('span');s1.textContent=c.level||'';var s2=document.createElement('span');s2.textContent=c.schedule||'';
      mt.append(s1,s2);art.append(num,h3,p,mt);cl.append(art);});

    var aq=d.acquire||{}; setHeading(document.getElementById('acquireTitle'),aq.title,aq.accent); t('acquireNote',aq.note);
    var shop=document.getElementById('shop');
    (aq.items||[]).forEach(function(it,i){var art=document.createElement('article');art.className='product reveal';
      var m=document.createElement('div');m.className='product__media';m.append(media(it.image,i));
      var body=document.createElement('div');body.className='product__body';
      var h3=document.createElement('h3');h3.textContent=it.title||'';
      var desc=document.createElement('p');desc.className='desc';desc.textContent=it.desc||'';
      var price=document.createElement('p');price.className='price';price.textContent=it.price||'';
      var btn=document.createElement('a');btn.className='btn';btn.href='#contact';btn.textContent='Enquire';
      body.append(h3,desc,price,btn);art.append(m,body);shop.append(art);});

    var co=d.contact||{};
    t('contactEyebrow',co.eyebrow); setHeading(document.getElementById('contactTitle'),co.title,co.accent); t('contactText',co.text);
    var list=document.getElementById('contactList');
    function li(label,val,href,blank){var l=document.createElement('li');var aa=document.createElement('a');aa.href=href;if(blank){aa.target='_blank';aa.rel='noopener';}var sp=document.createElement('span');sp.textContent=label;var b=document.createElement('b');b.textContent=val;aa.append(sp,b);l.append(aa);return l;}
    if(co.email)list.append(li('Email',co.email,'mailto:'+co.email));
    if(co.phone)list.append(li('Phone',co.phone,'tel:'+co.phone.replace(/[^+0-9]/g,'')));
    if(co.instagram)list.append(li('Instagram',co.instagram,co.instagramUrl||'#',true));
    if(co.studio)list.append(li('Studio',co.studio,'#'));

    initInteractions();
  }

  function initInteractions(){
    var fbtns=document.querySelectorAll('.filters button');
    var pieces=document.querySelectorAll('#gallery .piece');
    fbtns.forEach(function(b){b.addEventListener('click',function(){
      fbtns.forEach(function(x){x.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true');
      var f=b.dataset.filter;
      pieces.forEach(function(p){p.style.display=(f==='all'||p.dataset.type===f)?'':'none';});
    });});
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.12});
    document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
  }

  var seed=JSON.parse(document.getElementById('seed').textContent);
  fetch('data/content.json',{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(render)
    .catch(function(){render(seed);});
})();
</script>
</body>
</html>
